<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "tic_tac_toe.css">
    <title>Tic Tac Toe</title>
    
</head>
<body>

    <header id = "heading">   <!--Main heading-->
        <h1>Tic Tac Toe</h1>
    </header>

    <main class = "main_body">  <!-- Main section containing the game board and controls -->

        <div class = "board">  <!-- Game board containing nine clickable cells -->

            <button class = "cell"></button>
            <button class = "cell"></button>
            <button class = "cell"></button>
            <button class = "cell"></button>
            <button class = "cell"></button>
            <button class = "cell"></button>
            <button class = "cell"></button>
            <button class = "cell"></button>
            <button class = "cell"></button>

        </div>

        <div class = "buttons">
            <button class = "startBtn">Start</button>
            <button class = "resetBtn">Reset</button>
        </div><br><br>

        <p id = "message">Click Start To Play</p>  <!-- Displays the current player's turn or the game result -->
    </main>

    <script src = "tic_tac_toe.js"></script>
    
</body>
</html>
